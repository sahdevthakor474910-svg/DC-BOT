<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC-BOT Stream Player - {title}</title>
    <!-- Outfit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- HLS.js for .m3u8 adaptive stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #181824 0%, #0b0b10 100%);
            color: #f3f4f6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1020px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 14px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: #ff2a5f;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .logo span {
            color: #ffffff;
        }
        .title {
            font-weight: 600;
            font-size: 1rem;
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 200px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-mode {
            background: rgba(255, 255, 255, 0.08);
            color: #e5e7eb;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-mode:hover, .btn-mode.active {
            background: #ff2a5f;
            color: #ffffff;
            border-color: #ff2a5f;
        }
        .btn-direct {
            background: rgba(255, 42, 95, 0.15);
            color: #ff4d79;
            border: 1px solid rgba(255, 42, 95, 0.35);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-direct:hover {
            background: #ff2a5f;
            color: #ffffff;
            border-color: #ff2a5f;
        }
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: none;
        }
        .status-badge {
            font-size: 0.8rem;
            color: #9ca3af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #38ef7d;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Main Player Card -->
    <div class="container">
        <div class="header">
            <div class="logo">🎥 DC<span>BOT</span> Player</div>
            <div class="title" id="videoTitle">{title}</div>
            <div class="header-actions">
                <button id="btnHtml5" class="btn-mode active" onclick="switchToHtml5()">⚡ HTML5 Stream</button>
                <button id="btnEmbed" class="btn-mode" onclick="switchToEmbed()">🎬 Embed Player</button>
                <a id="btnDirect" href="{direct_url}" target="_blank" rel="noopener noreferrer" class="btn-direct">Direct Source ↗</a>
            </div>
        </div>

        <div class="player-wrapper">
            <video id="webVideo" controls autoplay preload="auto" playsinline>
                Your browser does not support HTML5 video.
            </video>
            <iframe id="embedFrame" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        </div>

        <div class="status-badge">
            <span id="playerStatus" class="status-tag">⚡ Initializing Stream...</span>
            <span>DC-BOT Ultra-Player Engine</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('webVideo');
        const embedFrame = document.getElementById('embedFrame');
        const statusEl = document.getElementById('playerStatus');
        const btnHtml5 = document.getElementById('btnHtml5');
        const btnEmbed = document.getElementById('btnEmbed');

        const streamUrl = "{stream_url}";
        const directUrl = "{direct_url}";
        const embedUrl  = "{embed_url}";

        let hlsInstance = null;
        let isEmbedActive = false;

        function setStatus(msg, isSuccess = true) {
            if (statusEl) {
                statusEl.innerText = msg;
                statusEl.style.color = isSuccess ? '#38ef7d' : '#ff4d79';
            }
        }

        function switchToEmbed() {
            if (!embedUrl || embedUrl.length < 5) {
                setStatus("⚠️ No official embed available for this source.", false);
                return;
            }
            isEmbedActive = true;
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            video.pause();
            video.style.display = 'none';

            embedFrame.style.display = 'block';
            if (embedFrame.src !== embedUrl) {
                embedFrame.src = embedUrl;
            }

            btnHtml5.classList.remove('active');
            btnEmbed.classList.add('active');
            setStatus("🎬 Switched to Official Embed Player (100% Playback)");
        }

        function switchToHtml5() {
            isEmbedActive = false;
            embedFrame.style.display = 'none';
            embedFrame.src = '';

            video.style.display = 'block';
            btnEmbed.classList.remove('active');
            btnHtml5.classList.add('active');

            startPlayback();
        }

        function playStream(targetUrl) {
            if (!targetUrl || targetUrl.length < 3) {
                switchToEmbed();
                return;
            }

            const isHls = targetUrl.includes('.m3u8');

            if (isHls && Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsInstance.loadSource(targetUrl);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("HLS autoplay prevented:", e));
                    setStatus("🔄 Adaptive HLS Stream Playing");
                });
                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        console.warn("HLS fatal error, falling back to embed:", data);
                        switchToEmbed();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl') && isHls) {
                // Native Safari HLS
                video.src = targetUrl;
                video.play().catch(e => console.log("Safari HLS autoplay prevented:", e));
                setStatus("🔄 Native Apple HLS Stream Active");
            } else {
                // Standard MP4 stream
                video.src = targetUrl;
                video.load();
                video.play()
                    .then(() => setStatus("⚡ Fast Video Stream Playing"))
                    .catch(err => {
                        console.log("Autoplay paused by browser policy. Click to play.", err);
                        setStatus("▶️ Click Play to start video");
                    });
            }
        }

        let fallbackCount = 0;
        video.addEventListener('error', function(e) {
            console.warn("HTML5 video error:", e);
            if (fallbackCount === 0 && directUrl && directUrl.startsWith('http') && directUrl !== streamUrl) {
                fallbackCount++;
                setStatus("🔄 Proxy error — retrying directly from CDN source...");
                playStream(directUrl);
            } else {
                console.log("Direct stream failed, falling back to official embed player...");
                switchToEmbed();
            }
        });

        function startPlayback() {
            fallbackCount = 0;
            // Prefer proxy stream if available, otherwise directUrl, otherwise embed
            if (streamUrl && streamUrl.length > 5) {
                setStatus("⚡ Loading Fast Stream Proxy...");
                playStream(streamUrl);
            } else if (directUrl && directUrl.length > 5 && (directUrl.includes('.mp4') || directUrl.includes('.webm') || directUrl.includes('.m3u8'))) {
                setStatus("⚡ Loading Direct Stream...");
                playStream(directUrl);
            } else if (embedUrl && embedUrl.length > 5) {
                switchToEmbed();
            } else {
                setStatus("⚠️ Video stream unavailable.", false);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            startPlayback();
        });
    </script>
</body>
</html>
