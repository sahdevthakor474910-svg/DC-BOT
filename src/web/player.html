<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player - {title}</title>
    <!-- Outfit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #181824 0%, #0b0b10 100%);
            color: #f3f4f6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 960px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 2;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            gap: 12px;
        }
        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: #ff2a5f;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .logo span {
            color: #ffffff;
        }
        .title {
            font-weight: 600;
            font-size: 1rem;
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .btn-direct {
            background: rgba(255, 42, 95, 0.15);
            color: #ff4d79;
            border: 1px solid rgba(255, 42, 95, 0.35);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-direct:hover {
            background: #ff2a5f;
            color: #ffffff;
            border-color: #ff2a5f;
        }
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status-badge {
            font-size: 0.75rem;
            color: #9ca3af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }
    </style>
</head>
<body>

    <!-- Main Player Card -->
    <div class="container">
        <div class="header">
            <div class="logo">🎥 DC<span>BOT</span> Player</div>
            <div class="title" id="videoTitle">{title}</div>
            <div class="header-actions">
                <a href="{direct_url}" target="_blank" rel="noopener noreferrer" class="btn-direct">Direct Source ↗</a>
            </div>
        </div>
        <div class="player-wrapper">
            <video id="webVideo" controls autoplay preload="metadata" playsinline>
                <source id="videoSource" src="{stream_url}" type="video/mp4">
                Your browser does not support the HTML5 video tag.
            </video>
        </div>
        <div class="status-badge">
            <span id="playerStatus">⚡ Fast Proxy Stream Active</span>
            <span>DC-BOT Media Engine</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('webVideo');
        const source = document.getElementById('videoSource');
        const status = document.getElementById('playerStatus');
        const directUrl = "{direct_url}";

        let failedOnce = false;

        video.addEventListener('error', (e) => {
            console.warn("Proxy stream failed, attempting direct URL fallback...", e);
            if (!failedOnce && directUrl && directUrl.startsWith("http")) {
                failedOnce = true;
                if (status) status.innerText = "🔄 Switched to Direct Source Stream";
                video.pause();
                source.setAttribute('src', directUrl);
                video.load();
                video.play().catch(err => console.log("Direct playback requires user click:", err));
            } else {
                if (status) status.innerText = "⚠️ Playback error — click Direct Source button above";
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (video) {
                video.focus();
                video.play().catch(err => {
                    console.log("Autoplay paused by browser policy. Click to play.", err);
                });
            }
        });
    </script>
</body>
</html>
