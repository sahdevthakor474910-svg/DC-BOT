services:
  - type: web
    name: dc-bot
    runtime: docker
    region: frankfurt
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:///data/bot.db
      - key: LOG_LEVEL
        value: info
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DEPLOY_COMMANDS
        value: "true"
